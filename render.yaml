services:
  - type: web
    name: speclens-server
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: USE_MOCK
        value: "true"
      - key: CLIENT_ORIGIN
        sync: false
      - key: MOBILE_API_KEY
        sync: false
